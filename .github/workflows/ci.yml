name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify restaurant service
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
